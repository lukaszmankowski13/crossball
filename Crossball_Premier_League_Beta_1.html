<title>Crossball Premier League — Beta</title>
<style>
:root{--bg:#080c17;--card:#121a2d;--card2:#18233a;--text:#eef3ff;--muted:#9aa8c2;--accent:#42d3ff;--green:#43d17a;--yellow:#ffcf5c;--line:#293652}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#080c17,#10182b);color:var(--text);font:15px system-ui}
header{padding:20px;position:sticky;top:0;z-index:5;background:#0b1222ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
h1{margin:0;font-size:25px} main{max-width:1200px;margin:20px auto;padding:0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px} button,.tab{border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--text);cursor:pointer;font-weight:700}button.primary,.tab.active{background:var(--accent);color:#06101a}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px} .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;padding:12px 0;border-bottom:1px solid var(--line)}
.score{font-size:25px;font-weight:900} .team{font-weight:800} .muted,.small{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--card2);font-size:11px;color:var(--muted)}
.event{padding:7px;border-bottom:1px solid var(--line)} .goal{color:var(--green);font-weight:800} .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);padding:10px;border-radius:10px} .stat b{font-size:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>

function standings(){
 const s=TEAMS.map((t,i)=>({i,pts:0,w:0,d:0,l:0,gf:0,ga:0,sh:0,on:0}));
 for(const r of state.results){let a=s[r.a],b=s[r.b];a.gf+=r.sa;b.gf+=r.sb;a.sh+=r.asha;b.sh+=r.bsh;a.on+=r.aon;b.on+=r.bon;a.ga+=r.sb;b.ga+=r.sa;
   if(r.sa>r.sb){a.pts+=3;a.w++;b.l++} else if(r.sa<r.sb){b.pts+=3;b.w++;a.l++} else {a.pts++;b.pts++;a.d++;b.d++;}
 }
 return s.sort((a,b)=>b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

function rand(min,max){return Math.random()*(max-min)+min}
function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<30);return k-1}

function simulate(a,b){
 const A=TEAMS[a],B=TEAMS[b];
 // Same philosophy as the match engine: quality/form/home/discipline/tempo
 // create attacking activity; shots create goals.
 const formA=rand(-3,3),formB=rand(-3,3),fatA=rand(-2,2),fatB=rand(-2,2);
 const home=2.0, tempo=rand(.92,1.12);
 const perfA=A.rating+formA+fatA+home;
 const perfB=B.rating+formB+fatB;
 const swing=rand(-7,7);
 const attackA=Math.max(0.55,Math.exp((perfA-perfB+swing)*.018))*tempo;
 const attackB=Math.max(0.55,Math.exp((perfB-perfA-swing)*.018))*tempo;
 let ash=Math.max(14,Math.min(46,poisson(24*attackA)+10));
 let bsh=Math.max(14,Math.min(46,poisson(24*attackB)+10));
 let aOn=0,bOn=0,ag=0,bg=0;
 const pa=PLAYERS.filter(p=>p.team===a),pb=PLAYERS.filter(p=>p.team===b);
 const goals=[];
 function teamShots(ps,shots,team,side){
   let rem=shots;
   const weights=ps.map(p=>p.role==='NAP'?2.8:p.role==='SKR'?2.0:.9);
   for(let i=0;i<shots;i++){const r=Math.random();}
   for(let i=0;i<shots;i++){
     let x=Math.random()*weights.reduce((x,y)=>x+y,0),idx=0;
     for(let j=0;j<weights.length;j++){x-=weights[j];if(x<=0){idx=j;break}}
     const p=ps[idx];
     const on=(p.role==='NAP'?.54:p.role==='SKR'?.49:.42)*(1+((p.q-75)*.004));
     if(Math.random()<on){
       if(side===0)aOn++;else bOn++;
       let g=(p.role==='NAP'?.16:p.role==='SKR'?.105:.055)*(1+((p.q-75)*.006));
       if(Math.random()<Math.max(.025,Math.min(.28,g))){
         if(side===0)ag++;else bg++;
         goals.push({team,player:p.name});
       }
     }
   }
 }
 teamShots(pa,ash,a,0); teamShots(pb,bsh,b,1);
 // Penalty: a rare event, one clear result, not a separate phantom stat.
 const pensA=Math.random()<.12?1:0,pensB=Math.random()<.12?1:0;
 if(pensA){
   const p=pa.filter(x=>x.role!=='BR').sort((x,y)=>y.q-x.q)[0];
   if(Math.random()<.76){ag++;goals.push({team:a,player:p.name,pen:true})}
 }
 if(pensB){
   const p=pb.filter(x=>x.role!=='BR').sort((x,y)=>y.q-x.q)[0];
   if(Math.random()<.76){bg++;goals.push({team:b,player:p.name,pen:true})}
 }
 return {a,b,sa:ag,sb:bg,asha:ash,bsh,aon:aOn,bOn,apens:pensA,bpens:pensB,goals};
}

function simulateRound(){
 const games=ROUNDS[state.round].map(([a,b])=>simulate(a,b));
 state.results.push(...games); state.last=games;
 state.round++;
 render();
}

function show(view){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 const btn=[...document.querySelectorAll('.tab')].find(x=>x.textContent.toLowerCase().includes(view==='round'?'kolejka':view==='table'?'tabela':view==='matches'?'wyniki':'statystyki'));
 if(btn)btn.classList.add('active');
 if(view==='round')roundView(); if(view==='table')tableView(); if(view==='matches')matchesView(); if(view==='stats')statsView();
}

}

}

}
