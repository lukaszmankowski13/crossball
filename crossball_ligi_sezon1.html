<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossball World — Ligi sezonu 1</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#697586;--accent:#183b56;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}header{background:var(--accent);color:#fff;padding:28px 20px}.wrap{max-width:1050px;margin:auto}h1{margin:0 0 6px;font-size:30px}header p{margin:0;opacity:.8}nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.nav{display:flex;gap:8px;overflow:auto;padding:10px 20px}.nav button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 13px;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--accent);color:#fff}main{padding:24px 20px 50px}.league{display:none}.league.active{display:block}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:16px}.head h2{margin:0;font-size:25px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:13px}.num{width:30px;height:30px;border-radius:50%;background:#edf1f5;display:grid;place-items:center;font-weight:bold;color:var(--accent);flex:none}.name{font-weight:600}.note{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;color:var(--muted);font-size:14px}@media(max-width:600px){h1{font-size:25px}.head{align-items:start;flex-direction:column}}</style></head><body>
<header><div class="wrap"><h1>🏑 Crossball World</h1><p>Sezon 1 · aktualny skład lig</p></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap" id="content"></main>
<script>
const leagues=[
["🇵🇱 Liga Polska",["KS Warszawianka","Gwardia Warszawa","WKS Śląsk Wrocław","Pomorzanin Toruń","AZS UMCS Lublin","Baltic Gdynia","Sośnica Gliwice","Pogoń Ruda Śląska"]],
["🏴 Crossball Premier League",["Edinburgh HCC","Wimbledon Club","Surbiton CC","Reading HC","Cardiff & Met","Ealing CBC","Sutton Coldfield","Durham University","University of Nottingham SC","Herne Bay United","Leicester City","Dundee Wanderers","Edinburgh United","Northampton Saints"]],
["🇩🇪 Crossball Bundesliga",["Hamburger Polo Club","VfL Wolfsburg","SC 1880 Frankfurt","Bonner THV","Nürnberger HTC","TSG Darmstadt","MSV Duisburg","HTB Hamburg","SSC Karlsruhe","Kreuzverein Köln","SV Bayer Wuppertal","Rot-Weiss Berlin"]],
["🇪🇸 Liga Hiszpańska",["Campo Madrid","Real Sociedad","Polo Barcelona","Atlètic Terrassa","Gijón Solimar","Sardinero Santander","Atlético Madrid","CCB Huesca","Aurrera de Vitoria","Valencia CCB","RC Pineda Sevilla","CN Mataró"]],
["🇫🇷 Liga Francuska",["Saint-Germain CBC","Lille Métropole","Girondins Bordeaux","La Vendéenne","Paris Université Club","Levallois SC","AS Corbeil-Essonnes","Lyon CB","TSB Valenciennes","EVA Strasbourg"]],
["🇳🇱 Liga Holenderska",["Quick Nijmegen","SV Oranje Wit","AH&BC Amsterdam","HC Rotterdam","Festina Amsterdam","SV Kampong","Crossball Den Haag","Kras Sport Haarlem","De Hoge Heide Vlijmen"]]
];
const nav=document.getElementById("nav"),content=document.getElementById("content");
leagues.forEach((l,i)=>{let key="l"+i,b=document.createElement("button");b.textContent=l[0];b.dataset.key=key;b.onclick=()=>show(key);nav.appendChild(b);let s=document.createElement("section");s.id=key;s.className="league"+(i?"":" active");s.innerHTML='<div class="head"><h2>'+l[0]+'</h2><div class="count">'+l[1].length+' drużyn</div></div><div class="grid">'+l[1].map((t,j)=>'<div class="team"><div class="num">'+(j+1)+'</div><div class="name">'+t+'</div></div>').join("")+'</div><div class="note">Skład sezonu 1. System rozgrywek będziemy uzupełniać w miarę ustalania zasad.</div>';content.appendChild(s)});
function show(k){document.querySelectorAll(".league").forEach(x=>x.classList.toggle("active",x.id===k));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.key===k))}
document.querySelector("nav button").classList.add("active");
</script></body></html>
