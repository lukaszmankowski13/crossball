<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossball Beta 5.19</title><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#080c17;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="Crossball_Beta_5.18.html"></iframe><script>
const f=document.getElementById('game');
f.addEventListener('load',()=>{
 const w=f.contentWindow,d=w.document;
 const T=w.T,all=w.all,nm=w.nm,role=w.role;
 d.title='Crossball Beta 5.19';
 const hdr=d.querySelector('header .muted'); if(hdr)hdr.textContent='World — Beta 5.19';
 const $=w.$;
 function playerQuality(n){const p=nm(n);return p?p[2]:70;}
 function activePlayers(k){return w.S.tm[k].filter(n=>role(n)!="BR"&&(w.S.tm[n].m||0)>0&&!w.S.tm[n].out);}
 function add(text){w.S.ev.push({m:w.S.min,t:text});}
 function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<20);return k-1;}
 function registerGoal(k,scorer,min,penalty){if(k==='war')w.S.a++;else w.S.b++;const q=w.S.tm[scorer];if(q){q.g++;q.r=Math.min(10,q.r+.55)}let assist=null;if(!penalty&&Math.random()<.62){const c=activePlayers(k).filter(n=>n!==scorer);if(c.length){assist=c[Math.floor(Math.random()*c.length)];w.S.tm[assist].a++;w.S.tm[assist].r=Math.min(10,w.S.tm[assist].r+.18)}}w.S.goals.push({min,team:k,scorer,assist,penalty:!!penalty});add(`<span class="goal">⚽ GOL! ${w.S.a}:${w.S.b} — ${scorer}</span>${assist?` <span class="small">asysta: ${assist}</span>`:""}`);}
 function chooseShooter(k){const arr=activePlayers(k);if(!arr.length)return null;const weights=arr.map(n=>{const p=nm(n),pos=role(n),q=w.S.tm[n],pw=pos==='NAP'?2.8:pos==='SKR'?2:1,shot=p[3]?.shot||65,f=1-.16*(q.fatigue||0);return Math.max(.1,pw*(.65+shot/100)*Math.max(.15,q.m/40)*f*(playerQuality(n)/80))});let r=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
 function resolveShot(k,min){const i=k==='war'?0:1,n=chooseShooter(k);if(!n)return;const p=nm(n),pos=role(n),q=w.S.tm[n];q.sh++;w.S.shots[i]++;const shot=p[3]?.shot||70;let on=pos==='NAP'?.55:pos==='SKR'?.49:.43;on*=1+Math.max(-.18,Math.min(.18,(shot-75)*.006));on*=1-.10*(q.fatigue||0);on=Math.max(.25,Math.min(.72,on));if(Math.random()>=on)return;q.onTarget++;w.S.onTarget[i]++;const keeper=w.S.tm[k==='war'?'ber':'war'].find(n=>role(n)==='BR'),save=keeper?(nm(keeper)[3]?.save||80):80;let g=pos==='NAP'?.205:pos==='SKR'?.145:.105;g*=1+Math.max(-.20,Math.min(.25,(shot-75)*.007));g*=1+Math.max(-.10,Math.min(.10,(80-save)*.004));g*=1-.10*(q.fatigue||0);g=Math.max(.035,Math.min(.30,g));if(Math.random()<g)registerGoal(k,n,min,false)}
 function resolvePenalty(k,min){const i=k==='war'?0:1,c=activePlayers(k);if(!c.length)return;const taker=c.sort((a,b)=>(nm(b)[3]?.shot||70)-(nm(a)[3]?.shot||70))[0],keeper=w.S.tm[k==='war'?'ber':'war'].find(n=>role(n)==='BR');const finish=(nm(taker)[3]?.shot||70)/100,save=keeper?(nm(keeper)[3]?.save||80)/100:.8,prob=Math.max(.68,Math.min(.90,.78+(finish-.7)*.25-(save-.8)*.20));w.S.shots[i]++;w.S.onTarget[i]++;w.S.tm[taker].sh++;w.S.tm[taker].onTarget++;if(Math.random()<prob)registerGoal(k,taker,min,true);else w.S.ev.push({m,t:`❌ RZUT KARNY — ${taker} nie wykorzystuje.`,penMiss:true,team:k,taker})}
 function simulateBatch(){try{w.S.run=false;w.S.finished=false;w.S.min=0;w.S.a=0;w.S.b=0;w.S.goals=[];w.S.ev=[];w.S.shots=[0,0];w.S.onTarget=[0,0];w.S.fouls=[0,0];w.S.pens=[0,0];w.S.penalty={war:null,ber:null};for(const k of ['war','ber'])for(const n of w.S.tm[k]){const q=w.S.tm[n];q.g=0;q.a=0;q.sh=0;q.x=0;q.penGoals=0;q.pass=0;q.passA=0;q.key=0;q.dr=0;q.drA=0;q.tack=0;q.inter=0;q.turn=0;q.f=0;q.r=6.1+Math.random()*.7;q.injury=null;q.injured=false;q.fatigue=0;q.onTarget=0}w.allocateMinutes('war');w.allocateMinutes('ber');for(const k of ['war','ber'])for(const n of w.S.tm[k]){if(role(n)!=='BR')w.S.tm[n].fatigue=Math.max(0,Math.min(1,((w.S.tm[n].m||0)-22)/18))}function strength(k){const field=T[k].p.filter(p=>p[1]!=='BR');let tot=field.reduce((z,p)=>z+(w.S.tm[p[0]].m||0),0)||1,weighted=0;for(const p of field){const q=w.S.tm[p[0]],fat=Math.max(0,Math.min(1,((q.m||0)-22)/18));weighted+=(playerQuality(p[0])-7*fat)*(q.m||0)}const br=T[k].p.find(p=>p[1]==='BR');return weighted/tot*.88+(br?playerQuality(br[0]):75)*.12}const sw=strength('war'),sb=strength('ber'),ew=sw+2.5+(w.S.form?.war||0),eb=sb+(w.S.form?.ber||0);function pc(k){const field=T[k].p.filter(p=>p[1]!=='BR'),avg=field.reduce((z,p)=>z+playerQuality(p[0]),0)/field.length,base=.25+Math.max(0,82-avg)*.006;let c=Math.random()<base?1:0;if(c&&Math.random()<.06)c=2;return c}const pcw=pc('war'),pcb=pc('ber');w.S.pens=[pcw,pcb];function fc(k,p){const field=T[k].p.filter(x=>x[1]!=='BR'),avg=field.reduce((z,x)=>z+playerQuality(x[0]),0)/field.length;return Math.max(p,Math.round(7+Math.max(-1.5,Math.min(1.5,(82-avg)*.08))+Math.random()*5))}w.S.fouls=[fc('war',pcw),fc('ber',pcb)];const penW=Math.max(.76,1-.07*pcw+.07*pcb),penB=Math.max(.76,1-.07*pcb+.07*pcw),tempo=.90+Math.random()*.22,baseW=Math.exp((ew-eb)*.028)*penW,baseB=Math.exp((eb-ew)*.028)*penB,swing=(Math.random()-.5)*.28,perfW=Math.max(.55,baseW*(1+swing)),perfB=Math.max(.55,baseB*(1-swing));const injuryList=[["stłuczenie uda",1,3,"kontakt"],["stłuczenie łydki",1,3,"kontakt"],["stłuczenie biodra",2,5,"kontakt"],["stłuczenie barku",2,5,"kontakt"],["skręcenie stawu skokowego",5,14,"kontakt"],["skręcenie kolana",10,30,"kontakt"],["naciągnięcie mięśnia uda",5,14,"przeciazenie"],["naciągnięcie łydki",5,12,"przeciazenie"],["naciągnięcie pachwiny",7,21,"przeciazenie"],["uraz mięśnia dwugłowego uda",10,28,"przeciazenie"],["uraz barku",7,21,"kontakt"],["uraz nadgarstka",7,21,"kontakt"],["uraz palca dłoni",3,10,"kontakt"],["uraz żeber",10,30,"kontakt"],["wstrząśnienie mózgu",7,21,"kontakt"],["zerwanie więzadła kolana",60,180,"kontakt"],["zerwanie Achillesa",180,300,"przeciazenie"],["poważne uszkodzenie mięśnia",30,90,"przeciazenie"]];if(Math.random()<.12){const k=Math.random()<.5?'war':'ber',c=activePlayers(k);if(c.length){const n=c[Math.floor(Math.random()*c.length)],x=injuryList[Math.floor(Math.random()*injuryList.length)],days=x[1]+Math.floor(Math.random()*(x[2]-x[1]+1));w.S.tm[n].injury={name:x[0],days,reason:x[3]};w.S.tm[n].injured=true;w.S.ev.push({m:5+Math.floor(Math.random()*35),t:`🩹 ${n} — ${x[0]} (${days} dni absencji).`,injury:true,team:k})}}for(let phase=0;phase<2;phase++){const total=Math.max(24,Math.min(44,poisson(16.5*tempo)+12));let share=perfW/(perfW+perfB);if(phase===1){if(w.S.a<w.S.b)share-=.07;if(w.S.a>w.S.b)share+=.03}share=Math.max(.28,Math.min(.72,share+(Math.random()-.5)*.08));const sws=Math.max(6,Math.round(total*share)),sbs=Math.max(6,total-sws);for(let i=0;i<sws;i++)resolveShot('war',phase*20+1+Math.floor(Math.random()*20));for(let i=0;i<sbs;i++)resolveShot('ber',phase*20+1+Math.floor(Math.random()*20));if(phase===0){for(let i=0;i<pcw;i++)resolvePenalty('war',5+Math.floor(Math.random()*15));for(let i=0;i<pcb;i++)resolvePenalty('ber',5+Math.floor(Math.random()*15))}}function fill(k){for(const n of w.S.tm[k].filter(n=>role(n)!=='BR')){const q=w.S.tm[n],pos=role(n),m=Math.max(1,q.m||0),f=q.fatigue||0,pr=pos==='OB'?.78:pos==='SKR'?.76:.72;q.pass=Math.max(3,Math.round(m*(.48+Math.random()*.16)));q.passA=Math.max(0,Math.min(q.pass,Math.round(q.pass*(pr-.06*f))));const dr=pos==='SKR'?.20:pos==='NAP'?.15:.08;q.dr=Math.max(0,Math.round(m*dr));q.drA=Math.max(0,Math.min(q.dr,Math.round(q.dr*(.52-.10*f))));q.key=Math.max(0,Math.round(m*(pos==='SKR'?.055:pos==='NAP'?.045:.025)));q.tack=Math.max(0,Math.round(m*(pos==='OB'?.11:pos==='SKR'?.045:.018)));q.inter=Math.max(0,Math.round(m*(pos==='OB'?.075:pos==='SKR'?.025:.012)));q.turn=Math.max(0,Math.round(m*(.025+.035*f)));q.x=0}const br=w.S.tm[k].find(n=>role(n)==='BR');if(br){const q=w.S.tm[br];q.pass=Math.max(4,Math.round(q.m*.35));q.passA=Math.round(q.pass*(.72+Math.random()*.15));q.x=0;q.onTarget=0}}fill('war');fill('ber');for(const k of ['war','ber'])for(const n of w.S.tm[k]){const q=w.S.tm[n],base=playerQuality(n);let r=6.4+(base-75)*.035+(Math.random()-.5)*.55;r+=q.g*.45+q.a*.18;if(q.sh>0)r+=(q.g/q.sh)*.7;r-=.38*(q.fatigue||0);if(q.injured)r-=.20;q.r=Math.max(5.2,Math.min(9.8,r))}w.S.finished=true;w.S.run=false;$("sim").disabled=false;$("clock").textContent='KONIEC MECZU';w.S.ev.sort((a,b)=>(a.m||0)-(b.m||0));add(`🏁 <b>KONIEC MECZU — ${w.S.a}:${w.S.b}</b>`);render() }catch(e){console.error(e);w.S.run=false;w.S.finished=true;$("sim").disabled=false;$("clock").textContent='Błąd symulacji';render()}}
 function renderGoals(){const el=d.getElementById('goalfeed');if(!el)return;let h='';for(const k of ['war','ber']){const goals=w.S.goals.filter(g=>g.team===k).sort((a,b)=>a.min-b.min);h+=`<div style="margin:6px 0"><b>${T[k].flag} ${T[k].name}</b>`;if(goals.length)for(const g of goals)h+=`<div style="margin-left:8px">${g.min}' — <b>${g.scorer}</b>${g.penalty?' <span class="small">(karny)</span>':g.assist?` <span class="small">(${g.assist})</span>`:''}</div>`;else h+=`<div class="small" style="margin-left:8px">brak goli</div>`;w.S.ev.filter(e=>e.penMiss&&e.team===k).forEach(e=>h+=`<div style="margin-left:8px">${e.m}' — <b>${e.taker}</b> <span class="small">(niewykorzystany karny)</span></div>`);h+='</div>'}el.innerHTML=h}
 function render(){renderGoals();d.getElementById('score').textContent=`${w.S.a} : ${w.S.b}`;d.getElementById('clock').textContent=w.S.min?`${w.S.min}' — ${w.S.min<=20?'1. połowa':'2. połowa'}`:'Gotowy';const c=d.getElementById('content');if(w.tab==='live')c.innerHTML=`<div class="feed">${w.S.ev.length?w.S.ev.map(e=>`<div class="event"><span class="min">${e.m}'</span><span>${e.t}</span></div>`).join(''):'<div class="small">Kliknij „Symuluj mecz”.</div>'}</div>`;if(w.tab==='stats')c.innerHTML=`<table><tr><th></th><th>Warsaw</th><th>Berlin</th></tr><tr><td>Strzały</td><td>${w.S.shots[0]}</td><td>${w.S.shots[1]}</td></tr><tr><td>Celne</td><td>${w.S.onTarget[0]}</td><td>${w.S.onTarget[1]}</td></tr><tr><td>Gole</td><td>${w.S.a}</td><td>${w.S.b}</td></tr><tr><td>Faule</td><td>${w.S.fouls[0]}</td><td>${w.S.fouls[1]}</td></tr><tr><td>Kary 1 min</td><td>${w.S.pens[0]}</td><td>${w.S.pens[1]}</td></tr></table>`;if(w.tab==='ratings'){c.innerHTML=['war','ber'].map(k=>`<h3>${T[k].flag} ${T[k].name}</h3><table><tr><th>Zawodnik</th><th>Ocena</th><th>G</th><th>A</th><th>Strz.</th><th>Cel.</th><th>Pod.</th><th>Klucz.</th><th>Dryb.</th><th>Odb.</th><th>Straty</th></tr>${Object.entries(w.S.tm).filter(([n,v])=>!Array.isArray(v)&&T[k].p.some(p=>p[0]===n)).sort((a,b)=>b[1].r-a[1].r).map(([n,s])=>`<tr><td>${n}</td><td><b>${s.r.toFixed(1)}</b></td><td>${s.g}</td><td>${s.a}</td><td>${s.sh}</td><td>${s.onTarget||0}</td><td>${s.passA}/${s.pass}</td><td>${s.key}</td><td>${s.drA}/${s.dr}</td><td>${s.tack+s.inter}</td><td>${s.turn}</td></tr>`).join('')}</table>`).join('')}if(w.tab==='minutes'){c.innerHTML=['war','ber'].map(k=>`<h3>${T[k].flag} ${T[k].name}</h3><table><tr><th>Zawodnik</th><th>Min.</th><th>Ocena</th><th>Kary</th></tr>${T[k].p.map(p=>{const q=w.S.tm[p[0]];return `<tr><td>${p[0]}</td><td>${q?.m||0}'</td><td>${(q?.r||0).toFixed(1)}</td><td>${q?.f||0}</td></tr>`}).join('')}</table>`).join('')}}
 w.simulateBatch=simulateBatch;w.render=render;w.startMatch=()=>{if(w.S.run)return;$("sim").disabled=true;simulateBatch()};
 d.getElementById('sim').onclick=w.startMatch;d.getElementById('reset').onclick=()=>w.reset();
 d.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{d.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');w.tab=x.dataset.t;render()});
 render();
});
</script></body></html>
