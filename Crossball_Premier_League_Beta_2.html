<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossball Premier League — Beta</title>
<style>
:root{--bg:#080c17;--card:#121a2d;--card2:#18233a;--text:#eef3ff;--muted:#9aa8c2;--accent:#42d3ff;--green:#43d17a;--yellow:#ffcf5c;--line:#293652}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#080c17,#10182b);color:var(--text);font:15px system-ui}
header{padding:20px;position:sticky;top:0;z-index:5;background:#0b1222ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
h1{margin:0;font-size:25px} main{max-width:1200px;margin:20px auto;padding:0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px} button,.tab{border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--text);cursor:pointer;font-weight:700}button.primary,.tab.active{background:var(--accent);color:#06101a}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px} .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;padding:12px 0;border-bottom:1px solid var(--line)}
.score{font-size:25px;font-weight:900} .team{font-weight:800} .muted,.small{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--card2);font-size:11px;color:var(--muted)}
.event{padding:7px;border-bottom:1px solid var(--line)} .goal{color:var(--green);font-weight:800} .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);padding:10px;border-radius:10px} .stat b{font-size:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>

  const games=pairs[round]||[];
  document.getElementById("app").innerHTML=`
  <div class="grid">
    <div class="card"><h2>Kolejka ${round+1}/13</h2>
    ${games.map(g=>`<div class="match"><b>${T[g[0]][0]}</b><span>–</span><b>${T[g[1]][0]}</b></div>`).join("")}
    ${round<13?`<br><button onclick="play()">▶ Symuluj kolejkę</button>`:"<p>Sezon zakończony.</p>"}</div>
    <div class="card"><h2>Tabela</h2>${tableHTML()}</div>
  </div>
  <div class="card"><h2>Rozegrane mecze</h2>${resultsHTML()}</div>
  <div class="card"><h2>Kadry</h2><div>${T.map((t,i)=>`<button onclick="squad(${i})">${t[0]}</button>`).join(" ")}</div><div id="squad"></div></div>`;
}
function tableHTML(){
 const s=standings();
 return `<table><tr><th>#</th><th>Drużyna</th><th>M</th><th>PKT</th><th>Bramki</th></tr>${s.map((x,i)=>`<tr><td>${i+1}</td><td>${T[x.i][0]}</td><td>${x.m}</td><td><b>${x.p}</b></td><td>${x.gf}:${x.ga}</td></tr>`).join("")}</table>`;
}
function resultsHTML(){
 if(!res.length)return '<span class="muted">Jeszcze nie rozegrano meczu.</span>';
 return res.map((r,i)=>`<div class="card"><div class="match"><span>${T[r.a][0]}</span><span class="score">${r.ga}:${r.gb}<small class="muted"><br>${r.sa}–${r.sb} strzałów • ${r.oa}–${r.ob} celnych</small></span><span>${T[r.b][0]}</span></div>
 <div class="muted">Kary: ${r.aPens}–${r.bPens}</div>
 <div>${r.goals.length?r.goals.sort((x,y)=>x.minute-y.minute).map(g=>`⚽ ${g.minute}' ${g.player}${g.pen?" (karny)":""}`).join(" • "):"Brak goli"}</div></div>`).join("");
}
function squad(t){
 const ps=teamPlayers(t);
 document.getElementById("squad").innerHTML=`<h3>${T[t][0]}</h3><table><tr><th>Zawodnik</th><th>Wiek</th><th>POZ</th><th>OVR</th><th>SHO</th><th>DEF</th><th>PAS</th><th>SPD</th><th>STA</th><th>G</th><th>S</th></tr>
 ${ps.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.age}</td><td>${p.role}</td><td>${p.ovr}</td><td>${p.shoot}</td><td>${p.def}</td><td>${p.pass}</td><td>${p.speed}</td><td>${p.stamina}</td><td>${p.goals}</td><td>${p.shots}</td></tr>`).join("")}</table>`;
}
function play(){
 if(round>=13)return;
 const games=pairs[round].map(g=>simulate(g[0],g[1]));
 res.push(...games); round++; render();
}
render();
</script>
</body>
</html>
